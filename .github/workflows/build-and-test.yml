name: Build and test

on:
  push:
    branches:
      - '!main'
  pull_request:

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - name : Checkout Repo
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        # The .NET 9 SDK supplies the net9.0 runtime for tests; global.json pins the SDK that builds.
        dotnet-version: 9.0.x
        global-json-file: global.json

    - name: Run dotnet format
      run: dotnet format lit-redis.sln --verify-no-changes

    - name: Install dependencies
      run: dotnet restore lit-redis.sln

    - name: Build
      run: dotnet build lit-redis.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test lit-redis.sln --logger GitHubActions --no-restore --verbosity normal
